services:
  db:
    image: mysql:8.0
    container_name: webapp_db
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in docker/.env or inject it from a secret manager}
      MYSQL_DATABASE: ${DB_NAME:?Set DB_NAME in docker/.env or inject it from a secret manager}
      MYSQL_USER: ${DB_USER:?Set DB_USER in docker/.env or inject it from a secret manager}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in docker/.env or inject it from a secret manager}

    volumes:
      - db_data:/var/lib/mysql
      - ../database/schema.sql:/docker-entrypoint-initdb.d/00_schema.sql:ro
      - ../database/seeders/01_seed.sql:/docker-entrypoint-initdb.d/01_seed.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root --password=\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

    networks:
      - webapp_network

  backend:
    build:
      context: ../
      dockerfile: docker/Dockerfile.backend

    container_name: webapp_backend
    restart: unless-stopped

    ports:
      - "127.0.0.1:3001:3001"

    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DB_HOST: db
      DB_USER: ${DB_USER:?Set DB_USER in docker/.env or inject it from a secret manager}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in docker/.env or inject it from a secret manager}
      DB_NAME: ${DB_NAME:?Set DB_NAME in docker/.env or inject it from a secret manager}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in docker/.env or inject it from a secret manager}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:3000}
      PORT: 3001

    depends_on:
      db:
        condition: service_healthy

    volumes:
      - ../backend:/app
      - /app/node_modules

    networks:
      - webapp_network

  frontend:
    build:
      context: ../
      dockerfile: docker/Dockerfile.frontend

    container_name: webapp_frontend
    restart: unless-stopped

    expose:
      - "3000"

    environment:
      FRONTEND_PORT: "3000"
      API_URL: /api
      API_PROXY_TARGET: http://backend:3001

    depends_on:
      backend:
        condition: service_started

    networks:
      - webapp_network
      - gateway_network

  gateway:
    image: nginx:alpine
    container_name: webapp_gateway
    restart: unless-stopped

    ports:
      - "3000:80"

    volumes:
      - ../gateway/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      frontend:
        condition: service_started

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

    networks:
      - gateway_network

volumes:
  db_data:

networks:
  webapp_network:
  gateway_network:
